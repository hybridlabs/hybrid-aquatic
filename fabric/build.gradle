plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.21.1:1.1.2")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.1:1.1.2")

    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}")
    // Bundled unmodified under LGPL-3.0; see https://github.com/TerraformersMC/Biolith
    include modImplementation("com.terraformersmc:biolith-fabric:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    // Dev runs load the release jar from run/mods, since Loom skips the Apollib jar nested inside it
    modCompileOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.1"
    modCompileOnly "maven.modrinth:carpet:$carpet_version"
    modLocalRuntime "maven.modrinth:carpet:$carpet_version"

    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    //modRuntimeOnly "maven.modrinth:cyanide:5.0.0-fabric"
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    modLocalRuntime "dev.emi:trinkets:${trinkets_version}"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
    }
}

// Datagen writes our Lithostitched biome injectors, so its run needs the release jar in its mods folder too
def lithostitchedRelease = configurations.detachedConfiguration(
    dependencies.create("maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.1"))
lithostitchedRelease.transitive = false

def prepareDatagen = tasks.register('prepareDatagen', Copy) {
    from lithostitchedRelease
    into 'run/datagen/mods'
}
tasks.named('runDatagen') { dependsOn prepareDatagen }

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'lithostitched', 'hybrid-api'
    embeds 'biolith'
    optional 'trinkets'
}

// Dev-only server runs that sample overworld biome placement and fail when one of our biomes never generates.
// The compat run adds Biomes O' Plenty and TerraBlender; each run leaves biome-survey-report.txt in its run dir
sourceSets {
    biomeSurvey {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

def biomeSurveys = [
    biomeSurvey      : [name: 'Biome Survey', dir: 'run/biome-survey', mods: []],
    biomeSurveyCompat: [name: 'Biome Survey (BOP + TerraBlender)', dir: 'run/biome-survey-compat', mods: [
        'https://cdn.modrinth.com/data/HXF82T3G/versions/fhyqphwv/BiomesOPlenty-fabric-1.21.1-21.1.0.14.jar',
        'https://cdn.modrinth.com/data/s3dmwKy5/versions/sux8kYHe/GlitchCore-fabric-1.21.1-2.1.0.2.jar',
        'https://cdn.modrinth.com/data/kkmrDlKT/versions/XNtIBXyQ/TerraBlender-fabric-1.21.1-4.1.0.8.jar',
    ]],
]

biomeSurveys.each { run, survey ->
    loom.runs.create(run) {
        server()
        configName = survey.name
        source sourceSets.biomeSurvey
        runDir survey.dir
    }

    def prepare = tasks.register("prepare${run.capitalize()}") {
        def dir = file(survey.dir)
        doLast {
            delete(new File(dir, 'world'), new File(dir, 'biome-survey-report.txt'))
            new File(dir, 'mods').mkdirs()
            // Accepts the Minecraft EULA for this throwaway server
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = 'level-seed=424242\nonline-mode=false\nserver-port=25598\n'
            survey.mods.each { url ->
                def jar = new File(dir, "mods/${url.substring(url.lastIndexOf('/') + 1)}")
                if (!jar.exists()) new URL(url).withInputStream { input -> jar.withOutputStream { it << input } }
            }
        }
    }
    tasks.named("run${run.capitalize()}") { dependsOn prepare }
}
