plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.21.11:1.3.0")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.11:1.3.0")

    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}")

    modCompileOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.11"
    modLocalRuntime "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.11"
    modCompileOnly "maven.modrinth:carpet:$carpet_version"
    modLocalRuntime "maven.modrinth:carpet:$carpet_version"

    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    //modRuntimeOnly "maven.modrinth:cyanide:5.0.0-fabric"
    modCompileOnly "maven.modrinth:XaT8sLP6:${trinkets_version}"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
    }
}

// runDatagen writes into src/generated/resources, which is part of the main sourceset.
// Without this ordering Gradle rejects a combined 'build runDatagen' invocation with an
// implicit-dependency validation error and datagen never gets a chance to run.
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') mustRunAfter tasks.named('runDatagen')
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'lithostitched', 'hybrid-api'
    optional 'trinkets'
}

// Dev-only server runs that sample overworld biome placement and fail when one of our biomes never generates.
// The compat run adds Biomes O' Plenty and TerraBlender; each run leaves biome-survey-report.txt in its run dir
sourceSets {
    biomeSurvey {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }

    // The compat survey reuses the same sources with extra worldgen mods on its runtime classpath.
    biomeSurveyCompat {
        compileClasspath += sourceSets.biomeSurvey.output + sourceSets.biomeSurvey.compileClasspath
        runtimeClasspath += sourceSets.biomeSurvey.output + sourceSets.biomeSurvey.runtimeClasspath
    }
}

// 1.21.11 is obfuscated, so the production mod jars have to go through Loom's remap
// configurations. The survey classpath is the run classpath, so no jars have to be copied
// into run/mods.
loom.createRemapConfigurations(sourceSets.biomeSurvey)
loom.createRemapConfigurations(sourceSets.biomeSurveyCompat)

dependencies {
    modBiomeSurveyRuntimeOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.11"

    // These three share one version number across loaders, so the Modrinth Maven alias with the
    // loader suffix is the only way to get the Fabric jars; the plain versions serve NeoForge.
    modBiomeSurveyCompatRuntimeOnly "maven.modrinth:biomes-o-plenty:${biomesoplenty_version}-fabric"
    modBiomeSurveyCompatRuntimeOnly "maven.modrinth:glitchcore:${glitchcore_version}-fabric"
    modBiomeSurveyCompatRuntimeOnly "maven.modrinth:terrablender:${terrablender_version}-fabric"

    // Loom drops the nested jar declarations while remapping, so these bundled libraries have to
    // be on the classpath themselves. Keep the versions in step with the jars the mods bundle.
    biomeSurveyCompatRuntimeOnly "net.jodah:typetools:0.6.3"
    biomeSurveyCompatRuntimeOnly "com.electronwill.night-config:core:3.6.7"
    biomeSurveyCompatRuntimeOnly "com.electronwill.night-config:toml:3.6.7"
}

def biomeSurveys = [
    biomeSurvey      : [name: 'Biome Survey', dir: 'run/biome-survey', sourceSet: sourceSets.biomeSurvey],
    biomeSurveyCompat: [name: 'Biome Survey (BOP + TerraBlender)', dir: 'run/biome-survey-compat', sourceSet: sourceSets.biomeSurveyCompat],
]

biomeSurveys.each { run, survey ->
    loom.runs.create(run) {
        server()
        configName = survey.name
        source survey.sourceSet
        runDir survey.dir
        programArgs 'nogui'
    }

    def prepare = tasks.register("prepare${run.capitalize()}") {
        def dir = file(survey.dir)
        doLast {
            delete(new File(dir, 'world'), new File(dir, 'biome-survey-report.txt'), new File(dir, 'mods'))
            new File(dir, 'mods').mkdirs()
            // Accepts the Minecraft EULA for this throwaway server
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = 'level-seed=424242\nonline-mode=false\nserver-port=25598\nmax-tick-time=-1\n'
        }
    }
    tasks.named("run${run.capitalize()}") { dependsOn prepare }
}
