plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.21.1:1.1.2")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.1:1.1.2")

    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}")
    // Bundled unmodified under LGPL-3.0; see https://github.com/TerraformersMC/Biolith
    include modImplementation("com.terraformersmc:biolith-fabric:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    // Dev runs load the release jar from run/mods, since Loom skips the Apollib jar nested inside it
    modCompileOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.1"
    modCompileOnly "maven.modrinth:carpet:$carpet_version"
    modLocalRuntime "maven.modrinth:carpet:$carpet_version"

    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    //modRuntimeOnly "maven.modrinth:cyanide:5.0.0-fabric"
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    modLocalRuntime "dev.emi:trinkets:${trinkets_version}"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
    }
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'lithostitched', 'hybrid-api'
    embeds 'biolith'
    optional 'trinkets'
}
