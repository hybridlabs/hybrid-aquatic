plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-fabric-26.1.2:1.4.0")

    implementation "com.geckolib:geckolib-fabric-$geckolib_version"
    localRuntime("com.terraformersmc:modmenu:${modmenu_version}")

    // Dev runs load the release jar from run/mods, since Loom skips the Apollib jar nested inside it
    compileOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-26.1"

    runtimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    //runtimeOnly "maven.modrinth:cyanide:5.0.0-fabric"
    compileOnly "maven.modrinth:XaT8sLP6:${trinkets_version}"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
    }
}

// Datagen writes our Lithostitched biome injectors, so its run needs the release jar in its mods folder too
def lithostitchedRelease = configurations.detachedConfiguration(
    dependencies.create("maven.modrinth:lithostitched:${lithostitched_version}-fabric-26.1"))
lithostitchedRelease.transitive = false

def prepareDatagen = tasks.register('prepareDatagen', Copy) {
    from lithostitchedRelease
    into 'run/datagen/mods'
}
tasks.named('runDatagen') { dependsOn prepareDatagen }

// runDatagen writes into src/generated/resources, which is part of the main sourceset.
// Without this ordering Gradle rejects a combined 'build runDatagen' invocation with an
// implicit-dependency validation error and datagen never gets a chance to run.
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') mustRunAfter tasks.named('runDatagen')
}

// Dev runs load the release jar from run/mods, since Loom skips the Apollib jar nested inside it
def prepareDevMods = tasks.register('prepareDevMods', Copy) {
    from lithostitchedRelease
    into 'run/mods'
}
tasks.matching { it.name in ['runServer', 'runClient'] }.configureEach { dependsOn prepareDevMods }

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'lithostitched', 'hybrid-api'
    optional 'trinkets'
}

// Dev-only server runs that sample overworld biome placement and fail when one of our biomes never generates.
// The compat run adds Biomes O' Plenty and TerraBlender; each run leaves biome-survey-report.txt in its run dir
sourceSets {
    biomeSurvey {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }

    // The compat survey reuses the same sources with extra worldgen mods on its runtime classpath.
    biomeSurveyCompat {
        compileClasspath += sourceSets.biomeSurvey.output + sourceSets.biomeSurvey.compileClasspath
        runtimeClasspath += sourceSets.biomeSurvey.output + sourceSets.biomeSurvey.runtimeClasspath
    }
}

dependencies {
    // 26.x runs unobfuscated, so plain runtime dependencies are enough; Loom has no remap
    // configurations to create. The survey classpath is the run classpath, so no jars have to be
    // copied into run/mods.
    biomeSurveyRuntimeOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-26.1"
    biomeSurveyRuntimeOnly "maven.modrinth:apollib:${apollib_version}"

    // These three share one version number across loaders, so the Modrinth Maven alias with the
    // loader suffix is the only way to get the Fabric jars; the plain versions serve NeoForge.
    biomeSurveyCompatRuntimeOnly "maven.modrinth:biomes-o-plenty:${biomesoplenty_version}-fabric"
    biomeSurveyCompatRuntimeOnly "maven.modrinth:glitchcore:${glitchcore_version}-fabric"
    biomeSurveyCompatRuntimeOnly "maven.modrinth:terrablender:${terrablender_version}-fabric"
}

def biomeSurveys = [
    biomeSurvey      : [name: 'Biome Survey', dir: 'run/biome-survey', sourceSet: sourceSets.biomeSurvey],
    biomeSurveyCompat: [name: 'Biome Survey (BOP + TerraBlender)', dir: 'run/biome-survey-compat', sourceSet: sourceSets.biomeSurveyCompat],
]

biomeSurveys.each { run, survey ->
    loom.runs.create(run) {
        server()
        configName = survey.name
        source survey.sourceSet
        runDir survey.dir
        programArgs 'nogui'
    }

    def prepare = tasks.register("prepare${run.capitalize()}") {
        def dir = file(survey.dir)
        doLast {
            delete(new File(dir, 'world'), new File(dir, 'biome-survey-report.txt'), new File(dir, 'mods'))
            new File(dir, 'mods').mkdirs()
            // Accepts the Minecraft EULA for this throwaway server
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = 'level-seed=424242\nonline-mode=false\nserver-port=25598\nmax-tick-time=-1\n'
        }
    }
    tasks.named("run${run.capitalize()}") { dependsOn prepare }
}

// GeckoLib 5.5 moved to the com.geckolib group, which hybrid-gradle's GeckoLib repository
// filter does not include yet.
repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('com.geckolib')
        }
    }
}
