pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    // Every plugin version for the whole build is resolved here from gradle.properties, so a
    // subproject only ever writes `id '<plugin>'` with no version of its own.
    plugins {
        id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
        id 'fabric-loom' version "$loom_version" apply false
        id 'net.neoforged.moddev.legacyforge' version "$moddev_version" apply false
        id 'org.jetbrains.changelog' version "$changelog_version" apply false
    }
}

plugins {
    // Provisions a matching JDK when the toolchain requested in java_version is not installed,
    // so the build no longer depends on the developer's JAVA_HOME.
    id 'org.gradle.toolchains.foojay-resolver-convention' version "$foojay_version"
}

// This should match the folder name of the project, or else IDEA may complain
// (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'hybrid-aquatic'
include 'common'
include 'fabric'
include 'forge'
