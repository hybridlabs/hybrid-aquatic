# Builds the mod on every push and pull request, as a first line of defence against bad commits.
#
# Linux only: that is the only platform the team develops and ships from. The mod jars themselves
# are platform-independent, so a second OS in the matrix only bought us a slower pipeline.
name: build
on: [push, pull_request]

# A newer push to the same ref makes an in-flight run redundant. Cancel PR runs; let pushes to a
# real branch finish so their artifacts stay available.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      # Gradle itself runs on the newest JDK listed; the others are here so the Java toolchain
      # this project requests (java_version in gradle.properties) is already present and Gradle
      # does not have to download it on every run.
      - name: set up jdks
        uses: actions/setup-java@v6
        with:
          java-version: |
            21
            17
          distribution: temurin

      # Validates the wrapper checksum, and caches ~/.gradle plus the Gradle build cache between
      # runs - the single biggest saving available to this pipeline.
      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/
          if-no-files-found: error
