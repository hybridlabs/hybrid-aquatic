# Builds the mod on every push and pull request, as a first line of defence against bad commits.
#
# Linux only: that is the only platform the team develops and ships from. The mod jars themselves
# are platform-independent, so a second OS in the matrix only bought us a slower pipeline.
name: build
on: [push, pull_request]

# A newer push to the same ref makes an in-flight run redundant. Cancel PR runs; let pushes to a
# real branch finish so their artifacts stay available.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      # setup-java points JAVA_HOME at the LAST version listed, and that is the JVM Gradle runs
      # on - it must be 21 or newer or Loom refuses to load. The earlier entry is the toolchain
      # this project compiles against (java_version in gradle.properties), installed here so
      # Gradle does not download a JDK on every run.
      - name: set up jdks
        uses: actions/setup-java@v6
        with:
          java-version: |
            21
          distribution: temurin

      # Validates the wrapper checksum, and caches ~/.gradle plus the Gradle build cache between
      # runs - the single biggest saving available to this pipeline.
      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        run: ./gradlew build "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64"

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
          if-no-files-found: error
