plugins {
    id 'dev.hybridlabs.common'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.20.1:1.1.2")

    modImplementation "software.bernie.geckolib:geckolib-forge-$geckolib_version"

    // Only used when another mod brings Biolith along
    compileOnly("com.terraformersmc:biolith-forge:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
}
