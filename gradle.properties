# Note: this project now builds with the Cloche Gradle plugin (single-project,
# multi-target). Mod metadata and most versions are configured directly in
# build.gradle.kts (the cloche { } block), not expanded from this file.
# Some keys below are retained for reference and are not all read by the build yet
# (a follow-up could centralize versions here or prune the unused keys).

# Gradle
org.gradle.jvmargs=-Xmx4g
org.gradle.daemon=false

# Project
java_version=17
kotlin_version=2.1.20

minecraft_version=1.20.1

version=1.5.4
group=dev.hybridlabs

# Metadata
mod_name=Hybrid Aquatic
mod_author=Hybrid Labs
mod_id=hybrid-aquatic
forge_mod_id=hybrid_aquatic
license=ARR

credits=MysticKoko, Aqua, Andante, Eggo, Ragno, murphy slaw, AyaanDB

description=A mod that enhances your underwater Minecraft experience! Explore improved rivers, swamps, oceans, and undersea caves with new creatures, blocks, and (coming soon) biomes.

# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_version=2023.09.03

# Dependencies
geckolib_version=1.20.1:4.8.2
lithostitched_version=1.4.11
biolith_version=1.0.1-alpha.1

# Fabric
fabric_version=0.92.6+1.20.1
fabric_loader_version=0.18.2

# Forge
forge_version=47.4.10
minecraft_version_range=[1.20.1, 1.22)
forge_loader_version_range=[47,)

# Fabric (folded from fabric/gradle.properties during Cloche migration)
fabric_kotlin_version=1.13.2
modmenu_version=7.2.2
reach_entity_attributes_version=2.4.0
debug_utils_version=1.0.5
carpet_version=1.4.112
